[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "meditopia-cli"
version = "0.1.0"
description = "CLI tool for uploading models and datasets to Meditopia"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["meditopia", "healthcare", "ai", "cli", "medical"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.urls]
Homepage = "https://meditopia.ai"
Repository = "https://github.com/your-org/meditopia"
"Bug Tracker" = "https://github.com/your-org/meditopia/issues"

[project.scripts]
medi = "meditopia.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["meditopia*"]
