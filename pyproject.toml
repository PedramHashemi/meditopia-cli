[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "meditopia-cli"
version = "0.1.0"
description = "CLI tool for uploading models and datasets to Meditopia"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
medi = "meditopia.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["meditopia*"]
